[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorscope"
version = "0.1.0"
description = "Confidence-aware memory analysis for TensorFlow Lite Micro models"
requires-python = ">=3.11"
dependencies = [
    "flatbuffers>=2.0",
    "numpy>=1.24",
]

[project.scripts]
tensorscope = "tensorscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

